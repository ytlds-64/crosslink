[package]
name = "crosslink"
version = "0.1.0"
edition = "2021"
description = "Cross-platform keyboard/mouse sharing (software KVM) for Windows and macOS"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
hex = "0.4"

# 加密（纯 Rust，无需 C 编译器）：
# X25519 密钥交换 + HKDF 派生会话密钥 + AES-256-GCM 认证加密
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"

# 平台 API：M2 输入捕获（GetAsyncKeyState）与注入（SendInput）。
# windows crate 0.58 把这些 API 放在 Win32_UI_Input_KeyboardAndMouse 模块下。
# 在 gnu 目标下也用 windows-targets 提供的 stub .lib，无需 msvc。
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",          # WNDCLASSEXW.HBR_BACKGROUND（HBRUSH）需要
] }

# macOS 输入捕获 / 注入（CGEventTap / CGEventPost）。仅 macOS 目标编译，不影响 Win/Linux。
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.22"
core-foundation = "0.9"
